name: Déployer sur GitHub Pages

on:
  push:
    branches:
      - claude/claude-code-capabilities-ckvnio
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Nettoyer avant publication
        run: rm -rf .git
      - name: Préparer l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
